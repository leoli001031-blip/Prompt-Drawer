[package]
name = "prompt-storyboard-manager"
version = "0.1.0"
description = "A local-first prompt and storyboard manager"
authors = ["lichenhao"]
edition = "2021"

[lib]
name = "prompt_storyboard_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.1", features = [] }

[dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tauri = { version = "2.3.1", features = [] }
uuid = { version = "1.16.0", features = ["v4", "serde"] }
